services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # kafka:29092 para contenedores en esta red, localhost:9092 para servicios en el host
      KAFKA_LISTENERS: INTERNO://0.0.0.0:29092,EXTERNO://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka:29092,EXTERNO://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNO:PLAINTEXT,EXTERNO:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
      # Un solo broker en desarrollo: sin réplicas y sin auto-create de topics
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
    healthcheck:
      test: /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
      interval: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server kafka:29092
        --create --if-not-exists
        --topic marcador
        --partitions 1
        --replication-factor 1

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: athenet
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      JAVA_OPTS: -Xmx256m

  mongo:
    image: mongo:8
    command: --wiredTigerCacheSizeGB 0.25
    ports:
      - "27017:27017"

  ms-statistics:
    build: .
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_MONGODB_URI: mongodb://mongo:27017/statistics
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_MARCADOR: marcador
      ESTADISTICAS_HILOS: 1
      STATISTICS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:4200
      AUDIT_ENABLED: "false"
      JAVA_TOOL_OPTIONS: -Xmx256m

  # Herramienta opcional de prueba manual (ya no es parte del flujo real de web-org).
  # Levantar con: docker compose --profile simulador up -d --build
  panel-simulador:
    profiles: ["simulador"]
    build: ../web-athenet-kafka-mock/panel-simulador
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: on-failure
    ports:
      - "5000:5000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
