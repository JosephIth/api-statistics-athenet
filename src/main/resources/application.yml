server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: statistics
  mongodb:
    uri: ${SPRING_MONGODB_URI:mongodb://localhost:27017/statistics}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # Sin offset previo, el grupo parte desde el primer mensaje del topic
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        # El productor no envía type headers: deserializa al record propio de este servicio
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.athenet.statistics.event.ScoreEvent

app:
  kafka:
    topic:
      marcador: ${KAFKA_TOPIC_MARCADOR:marcador}
    audit-enabled: ${AUDIT_ENABLED:false}
  cors:
    # Orígenes permitidos para REST y STOMP (separados por coma)
    allowed-origins: ${STATISTICS_ALLOWED_ORIGINS:http://localhost:5173}

estadisticas:
  hilos: ${ESTADISTICAS_HILOS:1}
